[project]
name = "veetrack-workers"
version = "0.1.0"
description = "VeeTrack Celery workers"
requires-python = ">=3.11"
dependencies = [
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "pydantic-settings>=2.7.0",
    "tenacity>=9.0",
    "flower>=2.0",
    "httpx>=0.28.0",
    "asyncpg>=0.30.0",
    "structlog>=26.1.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "feedparser>=6.0.11",
    "youtube-transcript-api>=0.6.3",
    "yt-dlp>=2025.1.1",
    "datasketch>=1.6.5",
    "beautifulsoup4>=4.13.0",
    "langdetect>=1.0.9",
    "lxml>=5.3.0",
    "gliner>=0.2.0",
    "sentence-transformers>=3.0.0",
    "hdbscan>=0.8.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "fakeredis>=2.26",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.21.0",
]
