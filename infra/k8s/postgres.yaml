---
# Headless Service for stable DNS within the StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: veetrack
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: veetrack
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
# ClusterIP Service so application pods reach postgres:5432
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  namespace: veetrack
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: veetrack
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: veetrack
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: veetrack
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: veetrack
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: veetrack
            - name: POSTGRES_DB
              value: veetrack
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: veetrack-secrets
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - veetrack
                - -d
                - veetrack
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - veetrack
                - -d
                - veetrack
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
