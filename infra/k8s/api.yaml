---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: veetrack
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: veetrack
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: veetrack
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: veetrack
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0        # zero-downtime deploys
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: veetrack
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: veetrack-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: veetrack-config
            - secretRef:
                name: veetrack-secrets
          env:
            # Override DATABASE_URL to inject the secret password at runtime
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: veetrack-secrets
                  key: postgres-password
            - name: DATABASE_URL
              value: "postgresql+asyncpg://veetrack:$(POSTGRES_PASSWORD)@postgres-svc:5432/veetrack"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: veetrack-secrets
                  key: jwt-secret
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: veetrack-secrets
                  key: anthropic-api-key
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: veetrack-secrets
                  key: sentry-dsn
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: veetrack
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
