name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same branch/PR when new commits arrive.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veetrack-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  backend:
    name: Backend — ruff, mypy, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veetrack-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src/app/

      - name: Unit tests (no infrastructure required)
        run: uv run pytest tests/unit/ tests/workers/ -m "not integration" -q
        env:
          DATABASE_URL: postgresql+asyncpg://veetrack:test@localhost:5432/veetrack
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret-for-ci-only-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

  backend-integration:
    name: Backend — integration tests (Postgres + Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veetrack-backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: veetrack
          POSTGRES_PASSWORD: test
          POSTGRES_DB: veetrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veetrack -d veetrack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run Alembic migrations
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://veetrack:test@localhost:5432/veetrack
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret-for-ci-only-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

      - name: Integration tests
        run: uv run pytest tests/integration/ -m "integration" -q
        env:
          DATABASE_URL: postgresql+asyncpg://veetrack:test@localhost:5432/veetrack
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret-for-ci-only-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Install e2e deps
        run: npm install
        working-directory: e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Start Next.js dev server
        run: pnpm --filter veetrack-frontend dev &
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Wait for dev server
        run: npx wait-on http://localhost:3000 --timeout 60000
        working-directory: e2e

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:3000
          CI: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  build-images:
    name: Docker — build all images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Only run on pushes to main (not on every PR to save CI minutes)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./veetrack-backend
          file: ./veetrack-backend/Dockerfile.api
          push: false
          tags: veetrack-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build workers image
        uses: docker/build-push-action@v6
        with:
          context: ./veetrack-backend
          file: ./veetrack-backend/Dockerfile.workers
          push: false
          tags: veetrack-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build workers beat image
        uses: docker/build-push-action@v6
        with:
          context: ./veetrack-backend
          file: ./veetrack-backend/Dockerfile.workers.beat
          push: false
          tags: veetrack-worker-beat:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./veetrack-frontend
          file: ./veetrack-frontend/Dockerfile
          push: false
          tags: veetrack-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
