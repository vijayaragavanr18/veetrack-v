[project]
name = "veetrack-backend"
version = "0.1.0"
description = "VeeTrack backend — FastAPI API + Celery workers"
requires-python = ">=3.11"
dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.12",
    # Cache / queue
    "redis>=5.2.0",
    "celery[redis]>=5.4.0",
    "flower>=2.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "email-validator>=2.2.0",
    # HTTP
    "httpx>=0.28.0",
    "tenacity>=9.1.4",
    # Logging / observability
    "structlog>=26.1.0",
    "python-json-logger>=4.1.0",
    "sentry-sdk[fastapi,sqlalchemy,asyncio,celery]>=2.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "prometheus-client>=0.20.0",
    # Connectors / ingestion
    "feedparser>=6.0.11",
    "youtube-transcript-api>=0.6.3",
    "yt-dlp>=2025.1.1",
    # NLP pipeline
    "datasketch>=1.6.5",
    "beautifulsoup4>=4.13.0",
    "langdetect>=1.0.9",
    "lxml>=5.3.0",
    "gliner>=0.2.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "sentence-transformers>=3.0.0",
    "hdbscan>=0.8.40",
    # LLM
    "anthropic>=0.40.0",
    # Exports
    "weasyprint>=69.0",
    "python-pptx>=1.0.2",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: marks tests that require live infrastructure (Redis, Postgres) — skip with -m 'not integration'",
]
filterwarnings = [
    "ignore::DeprecationWarning:starlette",
    "ignore::DeprecationWarning:httpx",
]

[dependency-groups]
dev = [
    "fakeredis>=2.26.0",
    "locust>=2.45.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.21.0",
    "types-passlib>=1.7.7.20260211",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]
